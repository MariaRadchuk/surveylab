# Фронтенд: Deployment і Service (Nginx віддає сторінку і проксіює /api до backend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.serviceName }}
  labels:
    app.kubernetes.io/name: frontend
    {{- include "surveylab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.rolloutId }}
      annotations:
        rollout-id: {{ .Values.rolloutId | quote }}
      {{- end }}
    spec:
      containers:
        - name: frontend
          image: {{ include "surveylab.image" (dict "root" . "name" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.serviceName }}
  labels:
    app.kubernetes.io/name: frontend
    {{- include "surveylab.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: http
