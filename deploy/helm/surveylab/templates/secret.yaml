# Secret: облікові дані PostgreSQL і рядок підключення бекенду
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "surveylab.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  POSTGRES_DB: {{ .Values.db.name | quote }}
  DATABASE_URL: postgresql://{{ .Values.db.user }}:{{ .Values.db.password }}@{{ include "surveylab.dbHost" . }}:5432/{{ .Values.db.name }}
