# Тестове середовище: контейнер Ubuntu 22.04, доступний по SSH на localhost:2224
[surveylab]
surveylab-staging ansible_host=127.0.0.1 ansible_port=2224 docker_storage_driver=vfs image_tag=local-arm64

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ansible-lab/lab_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
