name: SurveyLab Docker

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/docker-stage2.yml'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  # Збирання, сканування на вразливості та публікація образу кожного сервісу
  image:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE:$GITHUB_SHA"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"

  # Перевірка всього середовища: db + backend + frontend через docker compose
  compose-test:
    name: Compose smoke test
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Check services
        run: |
          docker compose ps
          curl -sf http://localhost:8081/health
          curl -sf -X POST http://localhost:8081/api/surveys \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke test","questions":[{"text":"Оцініть курс","type":"rating"}]}'
          curl -sf http://localhost:8081/api/surveys

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
