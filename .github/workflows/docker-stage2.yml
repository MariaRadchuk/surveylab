name: SurveyLab Docker

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'deploy/**'
      - '.github/workflows/docker-stage2.yml'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  # Збирання, сканування на вразливості та публікація образу кожного сервісу
  image:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE:$GITHUB_SHA"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"

  # Перевірка всього середовища: db + backend + frontend через docker compose
  compose-test:
    name: Compose smoke test
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Check services
        run: |
          docker compose ps
          curl -sf http://localhost:8081/health
          curl -sf -X POST http://localhost:8081/api/surveys \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke test","questions":[{"text":"Оцініть курс","type":"rating"}]}'
          curl -sf http://localhost:8081/api/surveys

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # Етап 3: розгортання середовища staging у кластері Kubernetes за допомогою Helm.
  # Запускається після успішного збирання образів на push у main (і develop для перевірки конвеєра).
  deploy-staging:
    name: Deploy staging (Helm)
    needs: [image, compose-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: staging

      - name: Lint Helm chart
        run: helm lint deploy/helm/surveylab --set db.password=lint

      - name: Deploy release
        run: |
          helm upgrade --install surveylab deploy/helm/surveylab \
            --namespace staging --create-namespace \
            -f deploy/helm/surveylab/values-staging.yaml \
            --set ingress.enabled=false \
            --set image.tag=${{ github.sha }} \
            --set db.password="$(openssl rand -hex 12)" \
            --wait --timeout 5m
          kubectl -n staging get pods,svc,hpa

      - name: Smoke test (helm test)
        run: helm test surveylab -n staging

      - name: Check API through frontend
        run: |
          kubectl -n staging port-forward svc/frontend 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/health
          curl -sf -X POST http://localhost:8080/api/surveys \
            -H 'Content-Type: application/json' \
            -d '{"title":"Staging smoke test","questions":[{"text":"Оцініть курс","type":"rating"}]}'
          curl -sf http://localhost:8080/api/surveys

      - name: Zero-downtime update
        run: |
          # у кластері запускаємо цикл запитів до фронтенда і оновлюємо реліз під навантаженням
          kubectl -n staging run probe --image=busybox:1.36 --restart=Never -- sh -c \
            'i=0; f=0; while [ $i -lt 300 ]; do wget -q -T 2 -O /dev/null http://frontend/health || f=$((f+1)); i=$((i+1)); sleep 0.2; done; echo "requests=$i failures=$f"'
          helm upgrade surveylab deploy/helm/surveylab \
            --namespace staging --reuse-values \
            --set rolloutId=${{ github.run_id }} \
            --wait --timeout 5m
          kubectl -n staging wait --for=jsonpath='{.status.phase}'=Succeeded pod/probe --timeout=180s
          kubectl -n staging logs probe
          kubectl -n staging logs probe | grep -q 'failures=0'

      - name: Rollback
        run: |
          helm history surveylab -n staging
          helm rollback surveylab 1 -n staging --wait --timeout 5m
          helm history surveylab -n staging
          helm test surveylab -n staging

      - name: Show cluster state
        if: always()
        run: |
          kubectl -n staging get pods -o wide
          kubectl -n staging describe pods | tail -n 60
